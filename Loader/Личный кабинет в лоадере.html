<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostra Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at top, #1a103c 0%, #0a0a0f 50%, #000000 100%);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-panel-strong {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(139, 92, 246, 0.1);
        }
        
        .avatar-container {
            background: conic-gradient(from 0deg, #7c3aed, #a855f7, #c084fc, #8b5cf6, #7c3aed);
            padding: 3px;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.4), 
                        0 0 80px rgba(139, 92, 246, 0.2),
                        inset 0 0 20px rgba(139, 92, 246, 0.3);
            position: relative;
        }
        
        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.3), transparent);
            z-index: -1;
            filter: blur(8px);
        }
        
        .action-btn {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.9) 0%, rgba(168, 85, 247, 0.9) 100%);
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.95) 0%, rgba(192, 132, 252, 0.95) 100%);
            box-shadow: 0 6px 30px rgba(139, 92, 246, 0.5),
                        0 0 20px rgba(168, 85, 247, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: translateY(-2px);
        }
        
        .action-btn:active:not(:disabled) {
            transform: translateY(0px) scale(0.98);
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        
        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        
        .upload-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        
        .upload-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }
        
        .upload-btn:active {
            transform: scale(0.95);
            background: rgba(139, 92, 246, 0.25);
        }
        
        .info-row {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        
        .status-badge {
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        
        .sidebar-icon {
            transition: all 0.3s ease;
        }
        
        .sidebar-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(2px);
        }
        
        .sidebar-icon.active {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center overflow-hidden bg-black">

    <!-- Main Container 850x550 -->
    <div class="relative w-[850px] h-[550px] glass-panel-strong rounded-2xl overflow-hidden flex shadow-2xl ring-1 ring-white/10">
        
        <!-- Ambient Background Effects -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
            <div class="absolute top-[-50%] right-[-20%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px]"></div>
            <div class="absolute bottom-[-30%] left-[-10%] w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[100px]"></div>
            <div class="absolute top-[40%] left-[30%] w-[200px] h-[200px] bg-purple-500/10 rounded-full blur-[80px]"></div>
        </div>

        <!-- Sidebar -->
        <div class="w-16 glass-panel border-r border-white/5 flex flex-col items-center py-6 gap-4 z-20 relative">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center shadow-[0_0_20px_rgba(139,92,246,0.5)] mb-2">
                <i data-lucide="ghost" class="w-6 h-6 text-white"></i>
            </div>
            
            <div class="flex flex-col gap-3 w-full px-3">
                <button class="sidebar-icon w-full aspect-square rounded-lg flex items-center justify-center text-gray-400 hover:text-white">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-icon active w-full aspect-square rounded-lg flex items-center justify-center text-purple-300">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-icon w-full aspect-square rounded-lg flex items-center justify-center text-gray-400 hover:text-white">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-icon w-full aspect-square rounded-lg flex items-center justify-center text-gray-400 hover:text-white">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                </button>
                <button class="sidebar-icon w-full aspect-square rounded-lg flex items-center justify-center text-gray-400 hover:text-white">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="mt-auto w-full px-3">
                <button class="sidebar-icon w-full aspect-square rounded-lg flex items-center justify-center text-gray-400 hover:text-red-400 hover:bg-red-500/10">
                    <i data-lucide="power" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col relative z-10">
            <!-- Top Bar -->
            <div class="h-14 glass-panel border-b border-white/5 flex items-center justify-between px-6">
                <div class="flex items-center gap-3">
                    <h1 class="text-white font-bold text-lg tracking-wider uppercase glow-text">Profile</h1>
                    <span class="text-[10px] font-bold text-purple-300 bg-purple-500/20 px-2 py-0.5 rounded border border-purple-500/30 uppercase tracking-wider">Premium</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 text-gray-400 text-xs font-mono bg-black/20 px-3 py-1.5 rounded-lg border border-white/5">
                        <i data-lucide="clock" class="w-3.5 h-3.5 text-purple-400"></i>
                        <span id="clock">00:00</span>
                    </div>
                    <div class="flex gap-2">
                        <button class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition-colors border border-white/5">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                        </button>
                        <button class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition-colors border border-white/5">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Profile Content -->
            <div class="flex-1 p-8 flex flex-col gap-6 overflow-hidden">
                <!-- Two Columns -->
                <div class="flex gap-8 flex-1">
                    <!-- Left Column - Avatar -->
                    <div class="w-2/5 flex flex-col items-center justify-center gap-6">
                        <div class="relative group cursor-pointer">
                            <div class="avatar-container w-40 h-40">
                                <div class="w-full h-full rounded-full bg-gray-900 overflow-hidden relative">
                                    <img src="https://i.pravatar.cc/400?img=33" alt="Profile" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all duration-500 group-hover:scale-110">
                                    <div class="absolute inset-0 bg-gradient-to-t from-purple-900/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                </div>
                            </div>
                            <!-- Reflection -->
                            <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-32 h-8 bg-purple-500/30 blur-2xl rounded-full"></div>
                        </div>
                        
                        <button class="upload-btn px-6 py-2.5 rounded-lg text-gray-300 text-sm font-medium flex items-center gap-2 group">
                            <i data-lucide="camera" class="w-4 h-4 group-hover:text-purple-400 transition-colors"></i>
                            <span>Upload / Change Avatar</span>
                        </button>
                    </div>

                    <!-- Right Column - Info -->
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="glass-panel rounded-2xl p-6 space-y-0 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500/50 to-transparent"></div>
                            
                            <!-- UID -->
                            <div class="info-row flex items-center justify-between py-4">
                                <span class="text-gray-500 text-xs uppercase tracking-widest font-semibold">UID</span>
                                <span class="text-purple-300 font-mono text-xl font-bold tracking-wider glow-text">98969</span>
                            </div>
                            
                            <!-- Username -->
                            <div class="info-row flex items-center justify-between py-4">
                                <span class="text-gray-500 text-xs uppercase tracking-widest font-semibold">Login Username</span>
                                <span class="text-white font-medium text-sm">GhostOperator_7</span>
                            </div>
                            
                            <!-- Group -->
                            <div class="info-row flex items-center justify-between py-4">
                                <span class="text-gray-500 text-xs uppercase tracking-widest font-semibold">Group</span>
                                <div class="flex gap-1.5 flex-wrap justify-end">
                                    <span class="status-badge px-2 py-1 rounded-md bg-gray-500/10 text-gray-300 text-[10px] border border-gray-500/20 font-medium">User</span>
                                    <span class="status-badge px-2 py-1 rounded-md bg-purple-500/10 text-purple-300 text-[10px] border border-purple-500/20 font-medium">Beta</span>
                                    <span class="status-badge px-2 py-1 rounded-md bg-pink-500/10 text-pink-300 text-[10px] border border-pink-500/20 font-medium">Developer</span>
                                    <span class="status-badge px-2 py-1 rounded-md bg-amber-500/10 text-amber-300 text-[10px] border border-amber-500/20 font-bold">Media+</span>
                                </div>
                            </div>
                            
                            <!-- Expires -->
                            <div class="flex items-center justify-between py-4">
                                <span class="text-gray-500 text-xs uppercase tracking-widest font-semibold">Client Expires</span>
                                <div class="flex items-center gap-2">
                                    <span class="relative flex h-2 w-2">
                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></span>
                                    </span>
                                    <span class="text-emerald-400 font-mono text-sm font-semibold">2024-12-31 23:59</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Action Buttons -->
                <div class="space-y-2.5 mt-auto">
                    <button class="action-btn w-full text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-3 text-sm tracking-wide relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                        <i data-lucide="external-link" class="w-4 h-4 opacity-80"></i>
                        Personal Cabinet
                    </button>
                    
                    <button class="action-btn w-full text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-3 text-sm tracking-wide relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                        <i data-lucide="calendar-plus" class="w-4 h-4 opacity-80"></i>
                        Extend Subscription
                    </button>
                    
                    <button class="action-btn w-full text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-3 text-sm tracking-wide relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                        <i data-lucide="refresh-cw" class="w-4 h-4 opacity-80"></i>
                        Reset HWID
                    </button>
                    
                    <button class="action-btn w-full text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-3 text-sm tracking-wide relative overflow-hidden group" disabled>
                        <i data-lucide="key-round" class="w-4 h-4 opacity-80"></i>
                        Activate Key
                        <span class="ml-2 text-[10px] opacity-60 bg-black/20 px-2 py-0.5 rounded">Coming Soon</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('clock').textContent = timeString;
        }
        updateClock();
        setInterval(updateClock, 1000);
        
        // Interactive feedback
        document.querySelectorAll('button:not([disabled])').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = '';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = '';
            });
        });
    </script>
</body>
</html>
